<app-table-toolbar
  [query]="query()"
  [columns]="columns()"
  [hidden]="hidden()"
  (search)="query.set($event)"
  (toggle)="toggleColumn($event)"
></app-table-toolbar>

<div class="table-wrap" cdkDropList (cdkDropListDropped)="drop($event)">
  <table
    mat-table
    [dataSource]="paged()"
    matSort
    (matSortChange)="onSort($event)"
    multiTemplateDataRows
  >
    @for (col of visibleCols(); track col.id) {
    <ng-container [matColumnDef]="col.id">
      <th mat-header-cell *matHeaderCellDef [style.width.px]="col.widthPx" cdkDrag cdkDragHandle>
        <span class="drag">⋮⋮</span> {{ col.header }}
      </th>
      <td mat-cell *matCellDef="let row" (click)="rowClick.emit(row)">
        <app-table-cell [value]="col.accessor(row)" />
      </td>
    </ng-container>
    } @if (detailTemplate()) {
    <!-- ÚNICA columna expandir -->
    <ng-container matColumnDef="_exp">
      <th mat-header-cell *matHeaderCellDef class="exp"></th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button (click)="$event.stopPropagation(); toggleExpand(row)">
          <mat-icon>@if (isExpanded(row)) { expand_less } @else { expand_more }</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- ÚNICA columna de detalle -->
    <ng-container matColumnDef="_detail">
      <td mat-cell *matCellDef="let row" [attr.colspan]="displayedColumns().length">
        <ng-container
          [ngTemplateOutlet]="detailTemplate()!"
          [ngTemplateOutletContext]="{ $implicit: row }"
        />
      </td>
    </ng-container>
    }

    <!-- SOLO un header/row default -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns();"></tr>

    <!-- Row de detalle con predicado -->
    @if (detailTemplate()) {
    <tr mat-row *matRowDef="let row; columns: ['_detail']; when: rowIsDetail"></tr>
    }
  </table>
</div>

<mat-paginator
  [length]="filteredSorted().length"
  [pageIndex]="pageIndex()"
  [pageSize]="pageSize()"
  [pageSizeOptions]="[5,10,25,50]"
  (page)="onPage($event)"
>
</mat-paginator>
