<app-header title="Proyectos">
    <input [formControl]="search" placeholder="Buscar proyectos por nombre o código">
    <a routerLink="/projects/new" class="btn">Nuevo Proyecto</a>
</app-header>
@if (state.loading()) {
    <p>Cargando...</p>
} @else {
    <table mat-table [dataSource]="state.filtered()">
        <ng-container matColumnDef="code">
            <th mat-header-cell *matHeaderCellDef>Código</th>
            <td mat-cell *matCellDef="let p">{{p.code}}</td>
        </ng-container>
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Nombre</th>
            <td mat-cell *matCellDef="let p">{{p.name}}</td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="cols"></tr>
        <tr mat-row *matRowDef="let row; columns: cols;"></tr>
    </table>
}
