<form class="form" (ngSubmit)="onSubmit()" [formGroup]="form">
  <div class="row">
    <mat-form-field appearance="outline" class="field">
      <mat-label>Código</mat-label>
      <input matInput formControlName="code" required />
    </mat-form-field>

    <mat-form-field appearance="outline" class="field">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="name" required />
    </mat-form-field>
  </div>

  <div class="row">
    <mat-form-field appearance="outline" class="field">
      <mat-label>Estado</mat-label>
      <mat-select formControlName="state">
        <mat-option value="ALL">Todos</mat-option>
        <mat-option value="UNASSIGNED">SIN ASIGNAR</mat-option>
        <mat-option value="NOT_STARTED">SIN EMPEZAR</mat-option>
        <mat-option value="IN_PROGRESS">EN PROCESO</mat-option>
        <mat-option value="CANCELLED">CANCELADO</mat-option>
        <mat-option value="INACTIVE">INACTIVO</mat-option>
        <mat-option value="UNDEFINED">SIN DEFINICIÓN</mat-option>
        <mat-option value="TO_REVIEW">PARA REVISAR</mat-option>
        <mat-option value="TO_CORRECT">CORREGIR</mat-option>
        <mat-option value="RELEASED">LIBERADO</mat-option>
        <mat-option value="SENT">ENVIADO</mat-option>
        <mat-option value="ISSUED">EMITIDO</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="field">
      <mat-label>Responsable</mat-label>
      <input matInput type="number" formControlName="responsibleId" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="field">
      <mat-label>Descripción</mat-label>
      <textarea matInput rows="4" formControlName="description"></textarea>
    </mat-form-field>

    <div class="actions">
      <button class="btn outline" type="button" (click)="cancel.emit()">Cancelar</button>
      <button class="btn" type="submit">Guardar</button>
    </div>
  </div>
</form>
