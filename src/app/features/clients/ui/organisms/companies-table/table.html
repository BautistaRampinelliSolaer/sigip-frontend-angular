<table mat-table [dataSource]="items()">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Empresa</th>
    <td mat-cell *matCellDef="let e">
      <button class="link" (click)="open(e.id)">{{e.name}}</button>
    </td>
  </ng-container>

  <ng-container matColumnDef="commercialName">
    <th mat-header-cell *matHeaderCellDef>Nombre comercial</th>
    <td mat-cell *matCellDef="let e">{{ e.commercialName || '—' }}</td>
  </ng-container>

  <ng-container matColumnDef="industry">
    <th mat-header-cell *matHeaderCellDef>Industria</th>
    <td mat-cell *matCellDef="let e">{{ e.industry || '—' }}</td>
  </ng-container>

  <ng-container matColumnDef="group">
    <th mat-header-cell *matHeaderCellDef>Grupo</th>
    <td mat-cell *matCellDef="let e">{{ e.group || '—' }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayed"></tr>
  <tr mat-row *matRowDef="let row; columns: displayed;"></tr>
</table>
