<app-header title="Horas Proyectos"></app-header>

    <form class="form" [formGroup]="form" (ngSubmit)="submit()">
      <label><span>Project ID</span><input formControlName="projectId" type="number" /></label>
      <label><span>Worked Hours</span><input formControlName="workedHours" type="number" step="0.5" /></label>
      <label><span>Date</span><input formControlName="workDate" type="date" /></label>
      <label><span>Description</span><input formControlName="description" /></label>
      <button type="submit" [disabled]="form.invalid">Add</button>
    </form>

    <table mat-table [dataSource]="rows()">
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let r">{{r.workDate}}</td>
      </ng-container>
      <ng-container matColumnDef="project">
        <th mat-header-cell *matHeaderCellDef>Project</th>
        <td mat-cell *matCellDef="let r">{{r.project?.name}}</td>
      </ng-container>
      <ng-container matColumnDef="hours">
        <th mat-header-cell *matHeaderCellDef>Hours</th>
        <td mat-cell *matCellDef="let r">{{r.workedHours}}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="cols"></tr>
      <tr mat-row *matRowDef="let row; columns: cols;"></tr>
    </table>
