<section class="filters">
  <!-- Primera fila -->
  <div class="filters__row">
    <!-- Proyecto -->
    <mat-form-field appearance="outline" class="filters__field">
      <mat-label>Proyecto</mat-label>
      <mat-select
        [value]="selectedProjectId() ?? ''"
        (selectionChange)="setProject($event.value || null)"
      >
        <mat-option [value]="''">Todos</mat-option>
        @for (p of projects(); track p.id) {
          <mat-option [value]="p.id">{{ p.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <!-- Usuario -->
    <mat-form-field appearance="outline" class="filters__field">
      <mat-label>Usuario</mat-label>
      <mat-select
        [value]="selectedUserId() ?? ''"
        (selectionChange)="setUser($event.value || null)"
      >
        <mat-option [value]="''">Todos</mat-option>
        @for (u of users(); track u.id) {
          <mat-option [value]="u.id">{{ u.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <!-- Desde -->
    <mat-form-field appearance="outline" class="filters__field">
      <mat-label>Desde</mat-label>
      <input
        matInput
        [matDatepicker]="pickerFrom"
        [value]="from()"
        (dateChange)="from.set($event.value)"
      />
      <mat-datepicker-toggle matSuffix [for]="pickerFrom"></mat-datepicker-toggle>
      <mat-datepicker #pickerFrom />
    </mat-form-field>

    <!-- Hasta -->
    <mat-form-field appearance="outline" class="filters__field">
      <mat-label>Hasta</mat-label>
      <input
        matInput
        [matDatepicker]="pickerTo"
        [value]="to()"
        (dateChange)="to.set($event.value)"
      />
      <mat-datepicker-toggle matSuffix [for]="pickerTo"></mat-datepicker-toggle>
      <mat-datepicker #pickerTo />
    </mat-form-field>

    <div class="filters__actions">
      <button mat-flat-button color="primary" (click)="applyDates()">Aplicar</button>
      <button mat-stroked-button color="primary" (click)="clearDates()">Limpiar</button>
    </div>
  </div>

  <!-- Segunda fila -->
  <div class="filters__row">
    <mat-form-field class="filters__search" appearance="outline">
      <mat-label>Buscar</mat-label>
      <input
        matInput
        placeholder="Descripción / Proyecto / Usuario"
        [value]="q()"
        (input)="q.set($any($event.target).value)"
      />
      <button
        mat-icon-button
        matSuffix
        aria-label="Buscar"
        (click)="applySearch()"
      >
        <mat-icon>search</mat-icon>
      </button>
    </mat-form-field>
  </div>
</section>
