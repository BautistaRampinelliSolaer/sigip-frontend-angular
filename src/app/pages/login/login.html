<section class="login-page">
  <div class="login-container">
    <form action="" class="login-form">
      <mat-form-field class="username-field">
        <mat-label>Ingrese su Usuario</mat-label>
        <input
          matInput
          placeholder="Usuario"
          type="text"
          [formControl]="username"
          required
          >
        </mat-form-field>
        <mat-form-field class="password-field">
        <mat-label>Ingrese su Contraseña</mat-label>
          <input
            matInput
            [type]="hide() ? 'password' : 'text'"
            placeholder="Contraseña"
            [formControl] ="password"
            required
          >
          <button
            matIconButton
            matSuffix
            (click)="clickEvent($event)"
            [attr.aria-label]="'Hide password'"
            [attr.aria-pressed]="hide()"

          >
            <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
      </mat-form-field>
          <button class="submit-button" matButton="outlined" (click)="login()">Ingresar</button>
    </form>
  </div>
</section>
