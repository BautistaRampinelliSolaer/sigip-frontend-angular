<mat-sidenav-container class="layout">

  <!-- SIDENAV -->
  @if (auth.isLogged()) {
    <mat-sidenav
      #drawer
      class="layout__sidenav"
      mode="side"
      [opened]="isSidenavOpen()"
    >
      <app-sidenav
        [userName]="userName()"
        [userRole]="userRole()"
        (logout)="onLogout()"
      />
    </mat-sidenav>
  }

  <!-- CONTENT -->
  <mat-sidenav-content class="layout__content">
    <header class="layout__header">
      <app-header
        (menuToggle)="toggleSidenav()"
      />
    </header>

    <main class="layout__main">
      <router-outlet />
    </main>

    <footer class="layout__footer">
      <app-footer />
    </footer>
  </mat-sidenav-content>
</mat-sidenav-container>
